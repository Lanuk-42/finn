# On-demand promise tracker for a ticker FINN hasn't precomputed. Started by the app (POST /api/promise/<ticker>),
# which then polls this run's step status for progress. Each stage is its own step so progress is real.
# Secret: GEMINI_API_KEY. Transcript extraction uses the best available Flash model first, falling back across the
# Flash models and then to lite (scripts/finn/gemini.py STRONG); at most 6 new calls per run.
name: promise-tracker
run-name: promise ${{ inputs.ticker }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "NSE symbol"
        required: true
      request_id:
        description: "set by the app to find this run"
        required: false
        default: manual

permissions:
  contents: write

concurrency:
  group: promise-${{ inputs.ticker }}
  cancel-in-progress: false

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINN_LLM_BUDGET: "6"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Already built? (a second click that raced the first one stops here, with no model calls)
        id: dup
        run: |
          git pull -q --ff-only origin main
          T=$(echo "${{ inputs.ticker }}" | tr '[:lower:]' '[:upper:]')
          if [ -f "data/promises/$T.json" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Tracker for $T already exists."; fi
      - name: "stage 1: fetch financial tables"
        if: steps.dup.outputs.skip != '1'
        run: python scripts/promise_job.py fetch "${{ inputs.ticker }}"
      - name: "stage 2: read earnings-call transcripts"
        if: steps.dup.outputs.skip != '1'
        run: python scripts/promise_job.py transcripts "${{ inputs.ticker }}"
      - name: "stage 3: find guidance and check every quote"
        if: steps.dup.outputs.skip != '1'
        run: python scripts/promise_job.py extract "${{ inputs.ticker }}"
      - name: "stage 4: save the tracker"
        if: steps.dup.outputs.skip != '1'
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          T=$(echo "${{ inputs.ticker }}" | tr '[:lower:]' '[:upper:]')
          git add "data/promises/$T.json" "data/screener/$T.json" data/cache/llm
          git diff --cached --quiet || git commit -m "data: on-demand promise tracker for $T"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
